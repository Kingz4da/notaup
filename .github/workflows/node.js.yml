
name: NotaUp - Build

on:
  push:
    branches: ["main", "guest-checkout"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Instalar dependências
        run: npm install

      - name: Compilar projeto
        run: npm run build
